name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find project -name settings.gradle.kts -o -name settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          echo "Project: $PROJECT"
          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltimateFileManager-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
